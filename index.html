<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#f9f3e8"/>
<title>Ladd_r — Discover what’s missing.</title>
<style>
:root{--cream:#f9f3e8;--ink:#151515;--teal:#46c2b8;--mint:#a8ded3;--coral:#f46f61;--gold:#f4c84a;--white:#fffdf8;--muted:#6d6a63;--line:3px solid var(--ink);--shadow:0 7px 0 var(--ink)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.025em}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:50;height:70px;background:rgba(249,243,232,.95);backdrop-filter:blur(10px);border-bottom:var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:26px}.brandmark{width:34px;height:34px;border:3px solid var(--ink);border-radius:50% 50% 45% 55%;background:var(--teal);position:relative}.brandmark:after{content:"";position:absolute;width:8px;height:8px;background:var(--ink);border-radius:50%;top:10px;left:11px}.navlinks{display:flex;gap:10px;align-items:center}.navlinks button{border:0;background:transparent;padding:9px 12px;border-radius:999px;font-weight:700}.navlinks button:hover{background:var(--mint)}.pill,.btn{border:var(--line);border-radius:999px;padding:11px 16px;font-weight:850;background:var(--white);box-shadow:3px 3px 0 var(--ink)}.btn.primary{background:var(--ink);color:white}.btn.gold{background:var(--gold)}.btn.coral{background:var(--coral)}.btn.teal{background:var(--teal)}.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}.landing{max-width:1200px;margin:auto;padding:28px 22px 80px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:42px;align-items:center;padding:44px 0 50px}.eyebrow{font-weight:900;text-transform:uppercase;letter-spacing:.08em;font-size:12px}.hero h1{font-size:clamp(48px,8vw,96px);line-height:.9;margin:12px 0 22px}.hero p{font-size:21px;line-height:1.45;max-width:650px}.cta{display:flex;gap:12px;flex-wrap:wrap}.trust{margin-top:16px;color:var(--muted);font-size:14px}.heroart{min-height:470px;position:relative}.blob{position:absolute;border:var(--line);border-radius:48% 52% 43% 57%}.b1{width:280px;height:250px;background:var(--coral);right:0;top:35px;transform:rotate(5deg)}.b2{width:340px;height:180px;background:var(--mint);right:90px;bottom:45px}.ladder{position:absolute;right:120px;top:40px;width:110px;height:390px;border-left:15px solid var(--gold);border-right:15px solid var(--gold);transform:rotate(8deg);filter:drop-shadow(3px 3px 0 var(--ink))}.ladder i{display:block;height:14px;background:var(--gold);border:3px solid var(--ink);margin:25px -9px}.monster{position:absolute;width:170px;height:210px;background:var(--teal);border:4px solid var(--ink);border-radius:48% 52% 42% 58%;right:205px;top:105px;transform:rotate(-8deg);box-shadow:7px 7px 0 var(--ink)}.monster:before{content:"";position:absolute;width:62px;height:62px;background:white;border:4px solid var(--ink);border-radius:50%;left:48px;top:30px}.monster:after{content:"";position:absolute;width:20px;height:20px;background:var(--ink);border-radius:50%;left:69px;top:51px}.monster .smile{position:absolute;width:54px;height:24px;border-bottom:5px solid var(--ink);border-radius:0 0 50px 50px;left:52px;top:100px}.monster .pack{position:absolute;width:50px;height:75px;border:4px solid var(--ink);background:var(--gold);border-radius:20px;right:-22px;top:70px}.section{padding:54px 0}.section h2{font-size:clamp(38px,5vw,64px);margin:0 0 8px}.section .sub{color:var(--muted);font-size:18px;max-width:720px}.grid{display:grid;gap:18px}.grid4{grid-template-columns:repeat(4,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.card{background:var(--white);border:var(--line);border-radius:24px;padding:22px;box-shadow:5px 5px 0 var(--ink)}.card.teal{background:var(--mint)}.card.gold{background:#ffe38c}.card.coral{background:#ffaaa1}.iconbubble{width:58px;height:58px;border:var(--line);border-radius:50%;display:grid;place-items:center;font-size:30px;background:var(--cream);margin-bottom:18px}.card h3{font-size:28px;margin:0 0 10px}.price{font-size:52px;font-family:Georgia,serif;font-weight:800}.price small{font:700 14px Inter,sans-serif}.cleanlist{padding:0;list-style:none;display:grid;gap:9px}.cleanlist li:before{content:"✓";font-weight:900;margin-right:8px}.promise{background:var(--ink);color:white;border-radius:28px;padding:28px;margin-top:26px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}.promise strong{font-family:Georgia,serif;font-size:30px}.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 70px)}.sidebar{border-right:var(--line);padding:20px 16px;background:#f3eadb;position:sticky;top:70px;height:calc(100vh - 70px);overflow:auto}.sidebar .tier{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin:8px 8px 18px}.sidebtn{width:100%;text-align:left;border:0;background:transparent;border-radius:14px;padding:12px 13px;font-weight:800;margin-bottom:4px}.sidebtn.active,.sidebtn:hover{background:var(--gold);border:2px solid var(--ink);padding:10px 11px}.content{padding:28px;max-width:1250px;width:100%;margin:0 auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.pagehead h1{font-size:48px;margin:0}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat{background:var(--white);border:var(--line);border-radius:20px;padding:18px}.stat b{font-size:30px;font-family:Georgia,serif}.job{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center}.job+.job{margin-top:12px}.jobmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.tag{border:2px solid var(--ink);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;background:var(--cream)}.match{font-size:26px;font-weight:900}.columns{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.mini{padding:16px;border:2px solid var(--ink);border-radius:16px;background:#fff}.mini+.mini{margin-top:10px}.progress{height:14px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:white}.progress i{display:block;height:100%;background:var(--teal)}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 10px;border-bottom:2px solid #ddd5c9;text-align:left}.select{border:2px solid var(--ink);border-radius:10px;padding:8px;background:white}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-weight:800}.field input,.field textarea,.field select{border:var(--line);border-radius:14px;padding:12px;background:white}.field textarea{min-height:120px;resize:vertical}.toast{position:fixed;right:20px;bottom:22px;background:var(--ink);color:white;padding:14px 18px;border-radius:14px;z-index:100;box-shadow:4px 4px 0 var(--coral)}.mobilebar{display:none}.footer{border-top:var(--line);padding:28px 22px;text-align:center;color:var(--muted)}
@media(max-width:900px){.navlinks .desk{display:none}.hero{grid-template-columns:1fr;padding-top:28px}.heroart{min-height:360px}.grid4,.grid3,.stats{grid-template-columns:repeat(2,1fr)}.shell{grid-template-columns:1fr}.sidebar{display:none}.content{padding:20px 16px 96px}.columns{grid-template-columns:1fr}.pagehead h1{font-size:40px}.mobilebar{display:grid;position:fixed;z-index:60;bottom:0;left:0;right:0;grid-template-columns:repeat(5,1fr);background:var(--cream);border-top:var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}.mobilebar button{border:0;background:transparent;font-size:11px;font-weight:800;padding:5px}.monster{right:42%;top:80px;transform:translateX(50%) rotate(-8deg);width:140px;height:175px}.ladder{right:22%;height:310px}.b1{width:220px;height:180px}.b2{width:260px;height:150px;right:40px}.promise{grid-template-columns:1fr}.job{grid-template-columns:1fr}.job .actions{justify-self:start}}
@media(max-width:600px){.topbar{height:62px;padding:0 14px}.brand{font-size:22px}.brandmark{width:30px;height:30px}.landing{padding:18px 14px 70px}.hero h1{font-size:54px}.hero p{font-size:18px}.heroart{min-height:320px}.grid4,.grid3,.stats{grid-template-columns:1fr}.section{padding:38px 0}.card{padding:18px}.content{padding-top:18px}.pagehead{align-items:center}.pagehead h1{font-size:36px}.price{font-size:44px}}
</style>
</head>
<body>
<div id="app" class="app">
    <header class="topbar"><div class="brand"><span class="brandmark"></span><span class="serif">Ladd_r</span></div></header>
    <main class="landing">
      <section class="hero">
        <div>
          <div class="eyebrow">Discover what’s missing.</div>
          <h1>Less searching.<br>More moving.</h1>
          <p>Ladd_r is loading your interactive preview.</p>
        </div>
      </section>
    </main>
  </div>
<script src="./app.js" defer></script>
</body>
</html>
